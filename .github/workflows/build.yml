name: Build Mod

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25' # Adjust to 25 if your project specifically requires JDK 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload Built Jar Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Artifacts
          path: build/libs/*.jar
          retention-days: 7